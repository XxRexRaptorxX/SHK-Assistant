<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 215">
  <defs>
    <marker id="wassersaeule-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dim-head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <!-- Offenes Gefäß mit Wasser (Dichte ρ) -->
  <rect class="water-fill" x="61" y="50" width="138" height="139"/>
  <line class="water" x1="61" y1="50" x2="199" y2="50"/>
  <path class="line" d="M60 20V190H200V20"/>
  <text class="sym" x="76" y="82">ρ</text>
  <!-- Messpunkt in der Tiefe h: Druck p -->
  <circle class="dim-head" cx="130" cy="160" r="4"/>
  <text class="sym" x="140" y="156">p</text>
  <!-- Fallbeschleunigung g -->
  <line class="dim" x1="30" y1="60" x2="30" y2="118" marker-end="url(#wassersaeule-dim)"/>
  <text class="sym" x="14" y="94">g</text>
  <!-- Wassertiefe h über dem Messpunkt -->
  <line class="dim" x1="200" y1="50" x2="246" y2="50"/>
  <line class="dim dash" x1="134" y1="160" x2="246" y2="160"/>
  <line class="dim" x1="240" y1="51" x2="240" y2="159" marker-start="url(#wassersaeule-dim)" marker-end="url(#wassersaeule-dim)"/>
  <text class="sym" x="248" y="110">h</text>
</svg>
