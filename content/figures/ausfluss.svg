  <!-- Behälter mit Ausflussvolumen V -->
  <rect class="water" x="121" y="160" width="168" height="30"/>
  <path class="line" d="M120 122V191H290V122"/>
  <text class="sym" x="250" y="182">V</text>
  <!-- Zeit t -->
  <circle class="line" cx="60" cy="145" r="24"/>
  <path class="thin" d="M60 145V128M60 145L72 152M60 121V125M84 145H80M60 169V165M36 145H40"/>
  <text class="sym" x="92" y="168">t</text>
</svg>
