  <path class="line" d="M120 120V194Q120 200 126 200H214Q220 200 220 194V120"/>
  <text x="150" y="166"><tspan class="sym">T</tspan><tspan class="sub" dy="4">m</tspan></text>
  <text x="134" y="190"><tspan class="sym">m</tspan><tspan class="sub" dy="4">k</tspan><tspan dy="-4"> + </tspan><tspan class="sym">m</tspan><tspan class="sub" dy="4">w</tspan></text>
</svg>
