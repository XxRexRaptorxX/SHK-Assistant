  <text x="240" y="78"><tspan class="sym">T</tspan><tspan class="sub" dy="4">w</tspan></text>
  <!-- Zusammengießen -->
  <path class="flow" d="M114 52C140 52 150 78 154 110" marker-end="url(#mischen-flow)"/>
  <path class="flow" d="M226 52C200 52 190 78 186 110" marker-end="url(#mischen-flow)"/>
  <!-- Mischung -->
  <path class="water-fill" d="M121 140H219V194Q219 199 214 199H126Q121 199 121 194Z"/>
