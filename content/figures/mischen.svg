<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 215">
  <defs>
    <marker id="mischen-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path class="flow-head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <!-- Kalter Stoff -->
  <path class="cold-soft" d="M21 32H109V80Q109 85 104 85H26Q21 85 21 80Z"/>
