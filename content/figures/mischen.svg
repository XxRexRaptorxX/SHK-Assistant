  <text x="30" y="56"><tspan class="sym">m</tspan><tspan class="sub" dy="4">k</tspan><tspan dy="-4">, </tspan><tspan class="sym">c</tspan><tspan class="sub" dy="4">k</tspan></text>
  <text x="30" y="78"><tspan class="sym">T</tspan><tspan class="sub" dy="4">k</tspan></text>
  <!-- Warmer Stoff -->
  <path class="hot-soft" d="M231 32H319V80Q319 85 314 85H236Q231 85 231 80Z"/>
  <path class="line" d="M230 20V80Q230 86 236 86H314Q320 86 320 80V20"/>
