<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 165">
  <defs>
    <marker id="waermetauscher-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dim-head" d="M0 0L10 5L0 10z"/>
    </marker>
    <marker id="waermetauscher-hot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path class="hot" d="M0 0L10 5L0 10z"/>
    </marker>
    <marker id="waermetauscher-cold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path class="cold" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <!-- Gegenstrom-Wärmetauscher: warmes Medium oben nach rechts, kaltes unten nach links -->
  <rect class="hot-soft" x="50" y="30" width="250" height="34"/>
  <rect class="metal" x="50" y="64" width="250" height="10"/>
  <rect class="cold-soft" x="50" y="74" width="250" height="34"/>
  <rect class="line" x="50" y="30" width="250" height="78"/>
  <line class="hot-line" x1="80" y1="47" x2="170" y2="47" marker-end="url(#waermetauscher-hot)"/>
  <line class="cold-line" x1="270" y1="91" x2="180" y2="91" marker-end="url(#waermetauscher-cold)"/>
  <!-- Temperaturdifferenzen an beiden Enden -->
  <line class="dim" x1="36" y1="47" x2="36" y2="91" marker-start="url(#waermetauscher-dim)" marker-end="url(#waermetauscher-dim)"/>
  <text x="2" y="74"><tspan class="sym">ΔT</tspan><tspan class="sub" dy="4">1</tspan></text>
  <line class="dim" x1="314" y1="47" x2="314" y2="91" marker-start="url(#waermetauscher-dim)" marker-end="url(#waermetauscher-dim)"/>
  <text x="318" y="74"><tspan class="sym">ΔT</tspan><tspan class="sub" dy="4">2</tspan></text>
  <text x="50" y="134"><tspan class="sym">ΔT</tspan><tspan class="sub" dy="4">1</tspan><tspan class="note" dy="-4"> = warm ein − kalt aus</tspan></text>
  <text x="50" y="156"><tspan class="sym">ΔT</tspan><tspan class="sub" dy="4">2</tspan><tspan class="note" dy="-4"> = warm aus − kalt ein</tspan></text>
</svg>
