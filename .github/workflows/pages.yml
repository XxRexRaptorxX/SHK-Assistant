# Baut die App bei jedem Push auf main und täglich (für die News) und veröffentlicht sie über GitHub Pages.
# Voraussetzung: Repository-Einstellungen → Pages → Source: „GitHub Actions“.
# Veröffentlicht wird nur, wenn Build und Tests durchlaufen.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Täglich 04:00 UTC (06:00 Sommerzeit, 05:00 Winterzeit): News neu abrufen
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur eine Veröffentlichung gleichzeitig; eine laufende wird nicht abgebrochen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Branchen-News aus content/news-feeds abrufen (public/news.json); bricht nie ab
      - run: npm run news
        continue-on-error: true
      # Edition aus .env (derzeit: internal)
      - run: npm run build
      # Nach dem Build, weil ein Test das fertige dist/ prüft (Offline-Cache)
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
