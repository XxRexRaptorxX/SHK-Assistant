<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Wird von src/theme/useTheme.ts an die gewählte Darstellung angepasst -->
    <meta name="theme-color" content="#e9edf3" />
    <!-- Weitere Metadaten (canonical, Vorschaubild, strukturierte Daten) ergänzt tools/vite-plugin-seo.ts -->
    <!-- Titel und Beschreibung setzt der Build aus src/config/seo.ts (HOME_TITLE, SITE_DESCRIPTION) -->
    <meta name="description" content="SHK-Assistant ist dein digitaler SHK Assistent für das Sanitär-, Heizungs- und Klimatechnik-Handwerk. Nutze Formeln, Rechner, Umrechner, Checklisten und ein umfangreiches SHK-Lexikon – auch offline." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>SHK-Assistant – Digitaler SHK Assistent für Heizungsbauer</title>
    <script>
      // Theme vor dem ersten Rendern setzen, damit es nicht hell aufblitzt.
      // Schlüssel, Werte und Vorgabe (System) wie in src/theme/theme.ts.
      var pref = null
      try {
        pref = localStorage.getItem('shk-theme')
      } catch (e) {}
      var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
